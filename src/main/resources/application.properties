# Configuration file
# key = value

# Application Properties
# URL for SSE
%dev.sourceUrl=http://localhost:8080/dashboard/stream
%dev.orderUrl=http://localhost:8080
%dev.streamUrl=http://localhost:8080/dashboard/stream
%dev.rewardUrl=http://localhost:8080/dashboard/rewards/stream
%dev.storeId=ATLANTA

%test.sourceUrl=http://localhost:8080/dashboard/stream
%test.streamUrl=http://localhost:8080/dashboard/stream
%test.orderUrl=http://localhost:8080
%test.rewardUrl=http://localhost:8080/dashboard/rewards/stream
%test.storeId=RALEIGH

%dev.loyaltyStreamUrl=http://localhost:8080/dashboard/loyaltystream
%test.loyaltyStreamUrl=http://localhost:8080/dashboard/loyaltystream

streamUrl=${STREAM_URL}
loyaltyStreamUrl=${LOYALTY_STREAM_URL}
rewardUrl=${REWARD_STREAM_URL}
orderUrl=${CORS_ORIGINS}
storeId=${STORE_ID}

# HTTP Security Headers
quarkus.http.header."X-Frame-Options".value=SAMEORIGIN
quarkus.http.header."X-Content-Type-Options".value=nosniff
quarkus.http.header."X-XSS-Protection".value=1; mode=block
quarkus.http.header."Strict-Transport-Security".value=max-age=31536000; includeSubDomains
quarkus.http.header."Referrer-Policy".value=strict-origin-when-cross-origin
quarkus.http.header."Permissions-Policy".value=geolocation=(), microphone=(), camera=()
quarkus.http.header."Content-Security-Policy".value=default-src 'self'; \
  script-src 'self' https://oss.maxcdn.com https://platform.twitter.com; \
  style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://maxcdn.bootstrapcdn.com https://cdnjs.cloudflare.com; \
  img-src 'self' data: blob: https://*.twimg.com; \
  connect-src 'self' ws: wss:; \
  font-src 'self' data: https://fonts.gstatic.com https://maxcdn.bootstrapcdn.com; \
  frame-src https://platform.twitter.com; object-src 'none'

# Cookie Security (HttpOnly prevents JS access; Secure and SameSite=Strict for prod TLS termination at OpenShift Router)
quarkus.http.cookie.http-only=true
%prod.quarkus.http.cookie.secure=true
%prod.quarkus.http.cookie.same-site=Strict

# HTTP
quarkus.http.cors=true
%dev.quarkus.http.cors.origins=http://localhost
%test.quarkus.http.cors.origins=http://localhost
quarkus.http.cors.origins=${CORS_ORIGINS}
quarkus.http.cors.methods=GET,PUT,POST
quarkus.http.cors.headers=X-Custom,accept, origin, authorization, content-type, x-requested-with
quarkus.http.cors.exposed-headers=Content-Disposition
quarkus.http.cors.access-control-max-age=24H

## Ports
%dev.quarkus.http.port=8080
quarkus.http.test-port=8080
quarkus.http.test-timeout=10s

## Logging
quarkus.log.level=DEBUG
io.qua.arc.impl=DEBUG
quarkus.log.category."io.quarkusdroneshop".level=DEBUG
quarkus.log.category."org.apache.kafka".level=ERROR
quarkus.log.category."jakarta.enterprise.inject".level=DEBUG
quarkus.log.category."jakarta.enterprise.inject.spi".level=DEBUG
quarkus.log.category."io.vertx.core.net.impl.ConnectionBase".level=OFF

# DATABASE
%dev.quarkus.datasource.devservices.enabled=true
%test.quarkus.datasource.devservices.enabled=true

# REST CLIENT
%dev.io.quarkusdroneshop.web.infrastructure.OrderService/mp-rest/url=http://localhost:8083
%dev.io.quarkusdroneshop.web.infrastructure.OrderService/mp-rest/scope=jakarta.inject.Singleton

io.quarkusdroneshop.web.infrastructure.OrderService/mp-rest/url=http://core-shop.apps.ocp4.home.ocpcloud.com
io.quarkusdroneshop.web.infrastructure.OrderServicee/mp-rest/scope=jakarta.inject.Singleton

# Kafka
%prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_URLS}
%dev.kafka.bootstrap.servers=localhost:9092
%test.kafka.bootstrap.servers=localhost:9092

### Incoming
#%dev.mp.messaging.incoming.web-updates.connector=smallrye-kafka
#%dev.mp.messaging.incoming.web-updates.value.deserializer=\
#  io.quarkusdroneshop.web.infrastructure.DashboardUpdateDeserializer
#%dev.mp.messaging.incoming.web-updates.broadcast=true
#%dev.mp.messaging.incoming.web-updates.topic=web-updates

mp.messaging.incoming.web-updates.connector=smallrye-kafka
mp.messaging.incoming.web-updates.value.deserializer=io.quarkusdroneshop.web.infrastructure.DashboardUpdateDeserializer
mp.messaging.incoming.web-updates.broadcast=true
mp.messaging.incoming.web-updates.topic=web-updates

mp.messaging.incoming.loyalty-updates.connector=smallrye-kafka
mp.messaging.incoming.loyalty-updates.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.loyalty-updates.broadcast=true
mp.messaging.incoming.loyalty-updates.topic=loyalty-updates

mp.messaging.incoming.rewards.connector=smallrye-kafka
mp.messaging.incoming.rewards.value.deserializer=io.quarkusdroneshop.web.infrastructure.RewardEventDeserializer
mp.messaging.incoming.rewards.broadcast=true
%prod.mp.messaging.incoming.rewards.topic=shop-bsite.rewards
%dev.mp.messaging.incoming.rewards.topic=rewards

# dataproduct-customer-360 は bsite の Flink ジョブが生成し、MirrorMaker2 経由で
# asite (この web アプリのデプロイ先) に shop-bsite.dataproduct-customer-360 として
# ミラーされる。各サイトの Apicurio Registry は独立しているため、Avro レコードに
# 埋め込まれた schema-id を解決するには実際にシリアライズした bsite の Registry URL を
# 明示的に指定する必要がある (asite の Registry では別のスキーマを指してしまう)。
mp.messaging.incoming.customer-360.connector=smallrye-kafka
mp.messaging.incoming.customer-360.value.deserializer=io.quarkusdroneshop.web.infrastructure.Customer360Deserializer
mp.messaging.incoming.customer-360.broadcast=true
mp.messaging.incoming.customer-360.enable.auto.commit=true
mp.messaging.incoming.customer-360.auto.offset.reset=latest
%prod.mp.messaging.incoming.customer-360.topic=shop-bsite.dataproduct-customer-360
%dev.mp.messaging.incoming.customer-360.topic=dataproduct-customer-360
%prod.mp.messaging.incoming.customer-360.apicurio.registry.url=http://droneshop-apicurioregistry-kafkasql.quarkusdroneshop-demo.router-default.apps.ocp.659hh.sandbox2372.opentlc.com/apis/registry/v2

# History 画面用: dataproduct-customer-360 を独立したコンシューマグループで別途購読し、
# 受信したプロファイルの更新をオンメモリに蓄積する (Customer360HistoryStore)。
# SSE 用 customer-360 チャンネルと同じトピックだが、group.id を分けて両方が全件を受け取れるようにする。
mp.messaging.incoming.customer-360-history.connector=smallrye-kafka
mp.messaging.incoming.customer-360-history.value.deserializer=io.quarkusdroneshop.web.infrastructure.Customer360Deserializer
# group.id を Pod ごとに一意にする (HOSTNAME を付与)。dataproduct-customer-360 は compacted topic
# なので、固定の group.id だと再デプロイ・再起動のたびにコミット済みオフセットから再開してしまい、
# auto.offset.reset=earliest が効かず (オフセットが既に存在するため)、オンメモリキャッシュが
# 空の状態から新規更新分しか蓄積されなくなる (= History が 0 件に見える不具合の原因)。
# Pod 起動ごとに新しい group.id を使うことで、毎回 earliest から全件バックフィルさせる。
mp.messaging.incoming.customer-360-history.group.id=quarkusdroneshop-web-customer360-history-${HOSTNAME:local}
mp.messaging.incoming.customer-360-history.auto.offset.reset=earliest
%prod.mp.messaging.incoming.customer-360-history.topic=shop-bsite.dataproduct-customer-360
%dev.mp.messaging.incoming.customer-360-history.topic=dataproduct-customer-360
%prod.mp.messaging.incoming.customer-360-history.apicurio.registry.url=http://droneshop-apicurioregistry-kafkasql.quarkusdroneshop-demo.router-default.apps.ocp.659hh.sandbox2372.opentlc.com/apis/registry/v2

### Outgoing
mp.messaging.outgoing.orders-up.connector=smallrye-kafka
mp.messaging.outgoing.orders-up.value.serializer=org.apache.kafka.common.serialization.StringSerializer
%prod.mp.messaging.outgoing.orders-up.topic=orders-in
%dev.mp.messaging.outgoing.orders-up.topic=orders-in

# Health Check
quarkus.smallrye-health.ui.always-include=true
